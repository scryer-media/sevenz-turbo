name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: sevenz-turbo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject committed fixtures outside the test resources
        run: |
          set -eu
          # Small archives under tests/resources and examples/data are the
          # differential corpus and are tracked deliberately. Anything else
          # binary is a generated fixture that must not be committed, and no
          # tracked archive may exceed 1 MiB.
          if git ls-files | grep -E '\.(7z|lzma|xz|zst|bin)$' \
              | grep -vE '^(tests/resources/|examples/data/)' ; then
            echo "generated archives must never be committed" >&2
            exit 1
          fi
          big="$(git ls-files -z -- tests/resources examples/data \
            | xargs -0 wc -c | awk '$1 > 1048576 && $2 != "total"')"
          if [ -n "$big" ]; then
            echo "tracked fixture over 1 MiB: $big" >&2
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo doc --locked --no-deps --all-features

  test:
    name: test-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # aws-lc-rs assembles AWS-LC with NASM on Windows. Every other lane on
      # this matrix has an assembler the build script already finds.
      - name: Install NASM (Windows, for aws-lc-rs)
        if: matrix.platform == 'windows-x86_64'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Test default features (aws-lc crypto backend)
        run: cargo test --locked --no-fail-fast
      - name: Test all features
        run: cargo test --locked --all-features --no-fail-fast
      - name: Test without default features
        run: cargo test --locked --no-default-features --no-fail-fast
      - name: Test the RustCrypto backend
        run: cargo test --locked --no-default-features --features aes256,native-crypto,bzip2,compress,ppmd,util --no-fail-fast

  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown, wasm32-wasip1
      # The browser feature set: no C toolchain there, so RustCrypto for
      # SHA-256 and AES alike. This is the command the README documents.
      - name: Check the wasm feature set
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features default_wasm
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      # The same set plus `crypto-host`, which moves the bulk AES-256-CBC
      # decrypt out to the embedding host.
      - name: Check the wasm feature set with the host-delegated AES
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features aes256_wasm,crypto-host,native-crypto,bzip2,compress,ppmd,util
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      # Decode-only and delegating: the configuration a wasm embedder actually
      # ships, which carries no in-guest block cipher at all. Without `util`,
      # so the crate is proven to build with no `wasm-bindgen` export surface.
      - name: Check the delegating wasm guest without an in-guest AES
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features aes256_wasm,crypto-host,bzip2,ppmd
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      # The same set with `util`: the `wasm-bindgen` surface compiles without
      # `compress`, exporting `decompress` alone. This lane is why the `compress`
      # half of `src/util/wasm.rs` is feature-gated.
      - name: Check the delegating wasm guest with the decode-only util bindings
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features aes256_wasm,crypto-host,bzip2,ppmd,util
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      # The conformance harness builds the wasm32-wasip1 guest example itself
      # and runs it under `wasmtime` with a reference host AES, comparing the
      # guest's extraction with the native decoder's.
      - name: Run the wasm host-AES conformance harness
        run: |
          cargo clippy --locked -p wasm-conformance --all-targets -- -D warnings
          cargo test --locked -p wasm-conformance

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from the crate manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --locked --all-features

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify the crates.io archive lists cleanly
        # `cargo package` cannot build while `lzma-turbo` is a path dependency
        # without a version; listing still proves the manifest and includes are
        # sane. The build check comes back when the dependency is a published
        # version pin (see docs/lzma-turbo-requests.md).
        run: cargo package --locked --no-verify --list

  ci-complete:
    name: ci-complete
    if: always()
    needs: [hygiene, fmt, clippy, docs, test, wasm, msrv, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required lane failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            exit 1
          fi
