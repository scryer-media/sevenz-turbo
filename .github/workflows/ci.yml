name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: sevenz-turbo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject committed fixtures outside the test resources
        run: |
          set -eu
          # Small archives under tests/resources and examples/data are the
          # differential corpus and are tracked deliberately; each is capped
          # at 1 MiB.
          if git ls-files | grep -E '\.(7z|lzma|xz|zst|bin)$' \
              | grep -vE '^(tests/resources/|examples/data/)' ; then
            echo "generated archives must never be committed" >&2
            exit 1
          fi
          big="$(git ls-files -z -- tests/resources examples/data \
            | xargs -0 wc -c | awk '$1 > 1048576 && $2 != "total"')"
          if [ -n "$big" ]; then
            echo "tracked fixture over 1 MiB: $big" >&2
            exit 1
          fi
      - name: Keep raw benchmark evidence outside Git
        run: |
          if git ls-files -- docs | grep -E '\.(json(\.zst)?|csv|tsv|tar\.gz|log)$'; then
            echo "raw benchmark evidence belongs outside the repository; see docs/benchmark-data.md" >&2
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo doc --locked --no-deps --all-features

  test:
    name: test-${{ matrix.platform.name }}-${{ matrix.configuration.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2025
        configuration:
          - name: aws-lc
            args: ""
          - name: all-features
            args: --all-features
          - name: no-default-features
            args: --no-default-features
          - name: rustcrypto
            args: --no-default-features --features aes256,native-crypto,bzip2,compress,ppmd,util
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nextest
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # aws-lc-rs assembles AWS-LC with NASM on Windows. Every other lane on
      # this matrix has an assembler the build script already finds.
      - name: Install NASM (Windows, for aws-lc-rs)
        if: matrix.platform.name == 'windows-x86_64' && (matrix.configuration.name == 'aws-lc' || matrix.configuration.name == 'all-features')
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Test ${{ matrix.configuration.name }}
        run: cargo nextest run --locked --no-fail-fast ${{ matrix.configuration.args }}
      - name: Run doctests
        run: cargo test --doc --locked --no-fail-fast ${{ matrix.configuration.args }}

  # Native guards also cover assembly reached through the archive APIs.
  # The 2 MiB guard alignment includes sevenz's HugeInput allocation. The
  # guarded cases: LZMA2 through every push path, parallel LZMA2 decode at two
  # threads, BCJ2, AES-256 (AWS-LC) and PPMd.
  guard-pages:
    name: guard-pages-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Install NASM (Windows, for aws-lc-rs)
        if: matrix.platform == 'windows-x86_64'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Guard both sides of native source and codec allocations
        run: cargo nextest run --locked --no-default-features --features compress,aes256,aws-lc-crypto,ppmd --test guard_pages --run-ignored all --no-fail-fast

  unsafe-valgrind:
    name: unsafe-valgrind-${{ matrix.platform }}-${{ matrix.scope }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64]
        scope: [allocation, source-lifecycle]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --quiet --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --quiet --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Aligned allocation and native madvise under Memcheck
        if: matrix.scope == 'allocation'
        run: cargo nextest run --locked --release --no-default-features --features compress --lib -E 'test(/^writer::input_buffer::tests::/)' --no-fail-fast
      - name: Archive source lifetimes, short reads and failures under Memcheck
        if: matrix.scope == 'source-lifecycle'
        run: cargo nextest run --locked --release --no-default-features --features compress --test input_buffer_tests --no-fail-fast

  unsafe-sanitizer:
    name: unsafe-${{ matrix.sanitizer }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64]
        sanitizer: [address, thread]
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: nightly-2026-09-01
          components: rust-src
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Instrument the aligned allocation and ownership tests
        run: cargo +nightly-2026-09-01 nextest run -Zbuild-std --target ${{ matrix.target }} --locked --no-default-features --features compress --lib -E 'test(/^writer::input_buffer::tests::/)' --no-fail-fast
      - name: Instrument source handoff, errors and teardown
        run: cargo +nightly-2026-09-01 nextest run -Zbuild-std --target ${{ matrix.target }} --locked --no-default-features --features compress --test input_buffer_tests --no-fail-fast
      # The concurrency machinery: the ordered job queue (send, receive,
      # cancellation, early drop, panics, at two to four workers) and the
      # coder-stage pipeline (failing and panicking coders, drop while
      # running, and every committed fixture chain). RustCrypto rather than
      # AWS-LC, so that the AES and SHA-256 under the pipeline are Rust the
      # sanitizer instruments.
      - name: Instrument the ordered queue and the coder pipeline
        run: cargo +nightly-2026-09-01 nextest run -Zbuild-std --target ${{ matrix.target }} --locked --no-default-features --features compress,aes256,native-crypto,ppmd --lib -E 'test(/^(ordered|pipeline)::tests::/)' --no-fail-fast
      - name: Instrument parallel LZMA2, folder-parallel and BCJ2 decodes
        run: cargo +nightly-2026-09-01 nextest run -Zbuild-std --target ${{ matrix.target }} --locked --no-default-features --features compress,aes256,native-crypto,ppmd --test parallel_decode_tests --no-fail-fast

  unsafe-miri-plan:
    name: unsafe-miri-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: nightly-2026-09-01
          components: miri, rust-src
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Discover only portable sevenz unsafe tests under cfg(miri)
        id: plan
        run: |
          cargo +nightly-2026-09-01 miri nextest list --locked --lib \
            --no-default-features --features compress --message-format json \
            -E 'test(/^writer::input_buffer::tests::/) & !test(/native_advice/)' > "$RUNNER_TEMP/miri-tests.json"
          python3 .github/scripts/miri-matrix.py "$RUNNER_TEMP/miri-tests.json" "$GITHUB_OUTPUT"

  unsafe-miri:
    name: unsafe-miri-${{ matrix.test }}
    needs: unsafe-miri-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.unsafe-miri-plan.outputs.matrix) }}
    env:
      MIRI_TEST: ${{ matrix.test }}
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: nightly-2026-09-01
          components: miri, rust-src
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Check one portable allocation invariant
        run: cargo +nightly-2026-09-01 miri nextest run --locked --lib --no-default-features --features compress --no-fail-fast -- --exact "$MIRI_TEST"

  unsafe-complete:
    name: unsafe-complete
    if: always()
    needs: [guard-pages, unsafe-valgrind, unsafe-sanitizer, unsafe-miri-plan, unsafe-miri]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native and Miri safety shard
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), os.environ["RESULTS"]'

  sdk-functional:
    name: sdk-functional-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build the pinned SDK C archive decoder
        run: bash .github/scripts/build-sdk-oracle.sh
      - name: Compare archive contracts and decoded bytes with the SDK
        run: cargo nextest run --locked --test sdk_functional --no-fail-fast

  unthreaded:
    name: unthreaded
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The LZMA and LZMA2 writers take the path a target without threads
      # takes (see Cargo.toml). Default features only.
      RUSTFLAGS: --cfg sevenz_turbo_unthreaded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nextest
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo nextest run --locked --no-fail-fast
      - run: cargo test --doc --locked --no-fail-fast

  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nextest
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      # The browser feature set: no C toolchain there, so RustCrypto for
      # SHA-256 and AES alike. This is the command the README documents.
      - name: Check the wasm feature set
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features default_wasm
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      # The same set plus `crypto-host`, which moves the bulk AES-256-CBC
      # decrypt out to the embedding host.
      - name: Check the wasm feature set with the host-delegated AES
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features aes256_wasm,crypto-host,native-crypto,bzip2,compress,ppmd,util
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      # Decode-only and delegating: the configuration a wasm embedder actually
      # ships, which carries no in-guest block cipher at all and hands the
      # CRC-32 to the host as well. Without `util`, so the crate is proven to
      # build with no `wasm-bindgen` export surface.
      - name: Check the delegating wasm guest without an in-guest AES
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features aes256_wasm,crc-host,crypto-host,bzip2,ppmd
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      # The same set with `util`: the `wasm-bindgen` surface compiles without
      # `compress`, exporting `decompress` alone. This lane is why the `compress`
      # half of `src/util/wasm.rs` is feature-gated.
      - name: Check the delegating wasm guest with the decode-only util bindings
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features aes256_wasm,crypto-host,bzip2,ppmd,util
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      # The conformance harness builds the wasm32-wasip1 guest example itself
      # and runs it under `wasmtime` with a reference host AES, SHA-256 and
      # CRC-32, comparing the guest's extraction with the native decoder's.
      - name: Run the wasm host-delegation conformance harness
        run: |
          cargo clippy --locked -p wasm-conformance --all-targets -- -D warnings
          cargo nextest run --no-fail-fast --locked -p wasm-conformance
      - name: Run doctests
        run: cargo test --doc --no-fail-fast --locked -p wasm-conformance

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from the crate manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --locked --all-features

  # Prepared, not enabled. The 7-Zip interop tests (sevenzip_encode_tests,
  # the 7zz half of bcj2_compress_tests, differential_7zz_tests) skip
  # themselves where no 7-Zip is on PATH, which is every other lane. With
  # SEVENZ_TURBO_7ZZ_REQUIRED set they fail instead. Enabling this job needs
  # the operator's approval of the install source, one of:
  #   - apt's `7zip` package on ubuntu-24.04 (provides `7zz`):
  #       sudo apt-get update && sudo apt-get install -y --no-install-recommends 7zip
  #   - `7zz` built from the pinned 7-Zip tree that
  #     .github/scripts/build-sdk-oracle.sh already fetches
  #     (CPP/7zip/Bundles/Alone2, makefile.gcc).
  # The job is commented out rather than gated on `if: false`, which
  # actionlint rejects as a constant condition. To enable it, uncomment it,
  # replace the placeholder install step and add it to ci-complete's needs.
  # sevenzip-interop:
  #   name: sevenzip-interop
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 30
  #   env:
  #     SEVENZ_TURBO_7ZZ_REQUIRED: "1"
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
  #       with:
  #         toolchain: ${{ env.RUST_TOOLCHAIN }}
  #     - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
  #       with:
  #         tool: cargo-nextest@0.9.143
  #     - name: Install 7-Zip (source pending the operator's approval)
  #       run: |
  #         echo "choose and approve a 7-Zip install source before enabling this job" >&2
  #         exit 1
  #     - name: Check 7-Zip interop with the tool required
  #       run: cargo nextest run --locked --all-features --test sevenzip_encode_tests --test bcj2_compress_tests --test differential_7zz_tests --test lzma2_mt_tests --no-fail-fast

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify the crates.io archive lists cleanly
        # Listing proves the manifest and the includes are sane.
        run: cargo package --locked --no-verify --list
      - name: Build the packaged crate from its own archive
        # Verification unpacks the archive into target/package and builds it
        # there against the packaged Cargo.lock, so a file the build needs
        # that the archive leaves out fails here rather than on crates.io.
        run: cargo package --locked

  ci-complete:
    name: ci-complete
    if: always()
    needs: [hygiene, fmt, clippy, docs, test, unsafe-complete, sdk-functional, unthreaded, wasm, msrv, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Every required lane must have succeeded: a skipped lane is as much a
      # gap as a failed one, so the check is the one unsafe-complete makes.
      - name: Require every lane to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), os.environ["RESULTS"]'
