[package]
name = "decode-bench"
description = "Times 7z LZMA2 extraction through 7-Zip, upstream sevenz-rust2 and this fork"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97.1"
version = "0.0.0"

# `native-crypto` swaps this crate's AES-256-CBC and SHA-256 over to
# RustCrypto, so the same binary can time either cryptography backend:
#   cargo build --release -p decode-bench                        # AWS-LC
#   cargo build --release -p decode-bench --features native-crypto
[features]
native-crypto = ["sevenz-turbo/native-crypto"]

[dependencies]
# Timed directly by `--cipher-only`, to price AES-256-CBC on its own against
# the reader chain that carries it. Same pin as the crate's.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# The fork under test. `compress` is for `op encode`, the write lane the Go
# harness in `bench/sevenz-turbo-bench` times against `7zz a`.
sevenz-turbo = { path = "../..", default-features = false, features = ["aes256", "aws-lc-crypto", "brotli", "compress", "bzip2", "deflate", "lz4", "ppmd", "util", "zstd"] }
# The secondary reference: the upstream release the fork was taken from.
sevenz-rust2 = { version = "=0.22.2", default-features = false, features = ["aes256", "brotli", "bzip2", "deflate", "lz4", "ppmd", "util", "zstd"] }
