[package]
name = "wasm-conformance"
description = "Runs sevenz-turbo's wasm host-delegation reference embedding under a native wasmtime and holds its extraction to the native decoder's"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97.1"
version = "0.0.0"

# The harness builds the crate's wasm guest example with a nested cargo and
# runs it here. Keeping wasmtime in this crate rather than in sevenz-turbo's
# dev-dependencies is what keeps it out of every other `cargo test` and
# `cargo clippy`; the wasm-conformance CI job is the one place it is built.
[dev-dependencies]
wasmtime = "48"
wasmtime-wasi = "48"
# The reference host AES, CRC-32 and SHA-256 the guest imports, and the writer
# that makes the archives it extracts. The CRC and SHA-256 are the crates
# `lzma-turbo` itself computes them with.
aes = "0.9"
cbc = "0.2"
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
sevenz-turbo = { path = "../..", features = ["aes256", "compress"] }
tempfile = "3"
