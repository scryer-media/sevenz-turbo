[package]
description = "A 7z decompressor/compressor in pure Rust; a fork of sevenz-rust2 that decodes LZMA and LZMA2 with lzma-turbo"
edition = "2024"
homepage = "https://github.com/scryer-media/sevenz-turbo"
keywords = ["7z", "7zip", "sevenz", "decompress"]
license = "Apache-2.0"
name = "sevenz-turbo"
readme = "README.md"
repository = "https://github.com/scryer-media/sevenz-turbo"
# Raised from upstream's 1.93: `lzma-turbo` requires 1.97.1.
rust-version = "1.97.1"
version = "0.26.0"
# Repository scaffolding that has no business in the crate archive.
exclude = [".github/", ".githooks/", ".gitleaks.toml", ".gitattributes", "renovate.json", "AGENTS.md", ".cargo/", "xtask/", "rust-toolchain.toml"]

# `tools/decode-bench` is a workspace member rather than an example because it
# depends on upstream `sevenz-rust2` to time the fork against it, and that
# dependency must not appear in this crate's own graph at all.
[workspace]
members = ["tools/decode-bench", "tools/wasm-conformance", "xtask"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["aes256", "aws-lc-crypto", "bzip2", "compress", "ppmd", "util"]
# wasm has no C toolchain, so it takes the RustCrypto backend.
default_wasm = ["aes256_wasm", "native-crypto", "bzip2", "compress", "ppmd", "util"]
nt-time = ["dep:nt-time"]
aes256 = ["dep:getrandom"]
aes256_wasm = ["aes256", "getrandom/wasm_js"]
# Cryptography backends for `aes256` — both SHA-256 *and* AES-256-CBC. See
# `src/crypto_backend.rs`: the features are additive, so `native-crypto` does
# not turn `aws-lc-crypto` off — it takes precedence over it. A build that
# wants no AWS-LC asks for `default-features = false` plus `native-crypto`.
# Enabling `aes256` with neither is a compile error, not a silent choice. The
# encoder's AES stays on RustCrypto's `cbc::Encryptor`, so `compress` pulls
# `aes`/`cbc` in regardless of the backend.
aws-lc-crypto = ["dep:aws-lc-rs", "lzma-turbo/crypto"]
native-crypto = ["dep:aes", "dep:cbc", "lzma-turbo/native-crypto"]
# Delegate the bulk AES-256-CBC *decrypt* to an embedder-installed hook (see
# the `hooks` module) instead of running a block cipher inside the guest.
# Engaged on `wasm32` only: on a native target the feature is accepted but
# inert (AWS-LC or RustCrypto stays selected and no hook is ever called), so
# feature unification in a mixed workspace cannot silently turn a native build
# into a delegating one. It adds no AES dependency at all — that is the point:
# `aes256,crypto-host` on wasm carries no in-guest block cipher. It does
# forward `lzma-turbo/native-crypto`, because the 7z key derivation's SHA-256
# is still computed in the guest and needs a backend that builds without a C
# toolchain.
#
# FOLLOW-UP (wire once `lzma-turbo` 0.3.6 lands, not before): `lzma-turbo` is
# growing its own `crc-host` / `crypto-host` hooks on branch
# `feature/wasm-host-hooks`. When that is published, this crate gains a
# `crc-host = ["lzma-turbo/crc-host"]` feature and `crypto-host` forwards
# `lzma-turbo/crypto-host`, so a wasm guest delegates the member CRC-32 and the
# KDF's SHA-256 as well. Deliberately NOT wired here: nothing may depend on an
# unpublished branch of `lzma-turbo`.
crypto-host = ["lzma-turbo/native-crypto"]
brotli = ["dep:brotli"]
bzip2 = ["dep:bzip2"]
# Writing archives. LZMA and LZMA2 are encoded by `lzma-turbo`'s port of the
# SDK encoder (see `src/codec/lzma_turbo/writer.rs`); the AES-256 encryptor
# stays on RustCrypto.
compress = ["lzma-turbo/enc", "dep:aes", "dep:cbc"]
# The alternative: encode LZMA and LZMA2 with `lzma-rust2`'s pure-Rust
# encoders instead. Off by default; with it on, `lzma-turbo`'s encoder is not
# used. Same option types, same archives, different bytes.
lzma-rust2-encoder = ["compress", "dep:lzma-rust2"]
deflate = ["dep:flate2"]
lz4 = ["dep:lz4_flex"]
ppmd = ["dep:ppmd-rust"]
util = ["dep:cap-std"]
zstd = ["dep:zstd"]

[dependencies]
zeroize = { version = "1.9", features = ["alloc"] }
aes = { version = "0.9", features = ["zeroize"], optional = true }
# The same pin and the same features `lzma-turbo` uses, so a build that has both
# crates resolves one copy of AWS-LC. AES-256-CBC is this crate's own (7z
# cryptography is not `lzma-turbo`'s job), so the dependency is direct.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }
brotli = { version = ">= 7, < 10", default-features = false, optional = true, features = ["std"] }
bzip2 = { version = "0.6", optional = true }
cbc = { version = "0.2", optional = true }
flate2 = { version = "1", optional = true, features = ["zlib-rs"] }
getrandom = { version = "0.4", optional = true }
# The version is what is published; the path is the sibling checkout used
# while the two crates are developed together, and is dropped for a release
# (`cargo xtask release` refuses to tag while it is here). Consumers get both
# crates from crates.io.
lzma-turbo = { version = "0.6.0", default-features = false, features = ["std", "asm", "crc", "filters"] }
# Encoders only, behind `lzma-rust2-encoder`, as the alternative to
# `lzma-turbo`'s. The decode path never reaches lzma-rust2; see AGENTS.md.
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "encoder", "optimization"], optional = true }
ppmd-rust = { version = "1", optional = true }
lz4_flex = { version = "0.14", optional = true }
nt-time = { version = "0.15", optional = true }
zstd = { version = "0.14", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = { version = "4.0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
rand = { version = "0.10" }
tempfile = "3"

# The wasm `crypto-host` example is driven by `tools/wasm-conformance`, a
# workspace member that owns the native `wasmtime` host supplying the reference
# AES the example imports. It lives outside this crate so that no other
# `cargo test` or `cargo clippy` builds wasmtime: `wasmtime` never enters this
# crate's dependency graph, dev or otherwise.

[[example]]
name = "advance"
required-features = ["default"]

[[example]]
name = "block_decompress"
required-features = ["default"]

[[example]]
name = "compress"
required-features = ["default"]

[[example]]
name = "decompress"
required-features = ["default"]

[[example]]
name = "decompress_progress"
required-features = ["default"]

[[example]]
name = "mt_decompress"
required-features = ["default"]

# The reference embedding of the `hooks` seam: a wasm guest that declares a raw
# import in a `host` namespace and installs a hook forwarding to it. It only
# makes sense with the delegating feature on.
[[example]]
name = "wasm_host_extract_conformance"
required-features = ["aes256", "crypto-host"]

[package.metadata.docs.rs]
all-features = true

[profile.release]
lto = "fat"
codegen-units = 1
